[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memorybear-grpc"
version = "0.1.0"
description = "Typed gRPC contracts and transport helpers for MemoryBear split services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.81.1,<2",
    "grpcio-health-checking>=1.66,<2",
    "protobuf>=6.33.5,<7",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.81.1,<1.82",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memorybear_grpc", "src/memorybear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/memorybear/**/*_pb2*.py" = ["E501", "I001", "UP009", "F401", "E402"]

# Resolve through the mirror so re-locks keep every lock URL on it.
[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true
