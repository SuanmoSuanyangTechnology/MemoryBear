[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mem-storage-core"
version = "0.1.0"
description = "Shared asynchronous Local, OSS, S3, and MinIO storage adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23,<26",
    "boto3>=1.35,<2",
    "oss2>=2.19,<3",
    "pydantic>=2.12,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mem_storage"]
