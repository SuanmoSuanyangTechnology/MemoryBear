[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mem-knowledge-models"
version = "0.1.0"
description = "Knowledge-owned schema shared with the release migration metadata"
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy>=2.0.44,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mem_knowledge_models"]
