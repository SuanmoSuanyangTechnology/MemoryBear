[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["python-jose>=3.3", "redis>=6.0", "httpx>=0.27", "pydantic>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23", "fastapi>=0.110", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
