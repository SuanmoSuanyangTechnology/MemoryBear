[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memory-storage-schema"
version = "0.1.0"
description = "Shared Memory node labels, Elasticsearch index definitions and document normalization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Pure stdlib data/helpers: no third-party runtime dependencies.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_storage_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Resolve through the mirror so re-locks keep every lock URL on it.
[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true
