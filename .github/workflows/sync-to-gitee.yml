name: Sync to Gitee

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 北京时间凌晨 2:00，每日全量同步

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        run: |
          GITEE_URL="https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/hangzhou-hongxiong-intelligent_1/MemoryBear.git"
          git remote add gitee "$GITEE_URL"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Full sync (scheduled)"
            for branch in $(git branch -r | grep -v HEAD | sed 's/origin\///'); do
              echo "Syncing branch: $branch"
              git push -f gitee "origin/$branch:refs/heads/$branch"
            done
            echo "Syncing tags..."
            git push gitee --tags --force
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Syncing tag: ${{ github.ref_name }}"
            git push -f gitee "${{ github.ref }}"
          else
            echo "Syncing branch: ${{ github.ref_name }}"
            git push -f gitee "origin/${{ github.ref_name }}:refs/heads/${{ github.ref_name }}"
          fi
