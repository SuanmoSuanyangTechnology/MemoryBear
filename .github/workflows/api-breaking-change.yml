name: API Breaking Change Check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  openapi-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Check if API files changed
        id: filter
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD -- 'api/app/' 'api/scripts/' 'api/requirements-openapi.txt' 'api/pyproject.toml' 'api/uv.lock' 'api/openapi-baseline.json' '.github/workflows/api-breaking-change.yml')
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no API changes
        if: steps.filter.outputs.skip == 'true'
        run: echo "No API files changed, skipping check."

      - name: Setup Python
        if: steps.filter.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.filter.outputs.skip == 'false'
        run: |
          pip install uv==0.7.12
          cd api
          uv venv .venv-openapi
          uv pip sync --python .venv-openapi/bin/python requirements-openapi.txt
          uv pip check --python .venv-openapi/bin/python
          .venv-openapi/bin/python -m unittest discover -s scripts -p test_openapi_export_stubs.py

      - name: Export current OpenAPI schema
        if: steps.filter.outputs.skip == 'false'
        run: |
          cd api
          .venv-openapi/bin/python scripts/export_openapi.py --isolated --v1-only -o openapi-current.json --audit-output openapi-current-audit.json

      # Compare the target branch with the merged result, including target-side changes.
      - name: Export PR base OpenAPI schema
        if: steps.filter.outputs.skip == 'false'
        id: pr_base
        run: |
          set -e
          BASE_DIR="${RUNNER_TEMP}/openapi-pr-base"
          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          # Use the same export harness, but import each revision's own application.
          cp api/scripts/export_openapi.py "$BASE_DIR/api/scripts/export_openapi.py"
          cp api/scripts/openapi_export_stubs.py "$BASE_DIR/api/scripts/openapi_export_stubs.py"
          if [ ! -f "$BASE_DIR/api/requirements-openapi.txt" ]; then
            echo "PR base lacks isolated export dependencies; land the export infrastructure first."
            exit 1
          fi
          cd "$BASE_DIR/api"
          uv venv .venv-openapi
          uv pip sync --python .venv-openapi/bin/python requirements-openapi.txt
          uv pip check --python .venv-openapi/bin/python
          .venv-openapi/bin/python scripts/export_openapi.py \
            --isolated --v1-only \
            --audit-output "${{ github.workspace }}/api/openapi-pr-base-audit.json" \
            -o "${{ github.workspace }}/api/openapi-pr-base.json"
          echo "exported=true" >> "$GITHUB_OUTPUT"

      - name: Check breaking approval label
        if: steps.filter.outputs.skip == 'false'
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            --jq '.[].name' | grep -Fxq 'api-breaking-approved'; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install oasdiff
        if: steps.filter.outputs.skip == 'false'
        run: |
          curl -sSfL https://raw.githubusercontent.com/Tufin/oasdiff/main/install.sh | sudo sh

      - name: Run OpenAPI breaking change checks
        if: steps.filter.outputs.skip == 'false'
        id: api_diff
        env:
          API_BREAKING_APPROVED: ${{ steps.approval.outputs.approved }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_EXPORTED: ${{ steps.pr_base.outputs.exported }}
        run: |
          cd api
          set +e

          REPORT="oasdiff-report.md"
          # Both the gate and report compare actual code exports.
          RELEASE_BASELINE="openapi-pr-base.json"
          # PR 报告基线：PR Base SHA 实际导出的 schema
          PR_BASE_SCHEMA="openapi-pr-base.json"
          # 目标：PR 合并结果实际导出的 schema
          CURRENT="openapi-current.json"

          BASE_SHORT=$(git rev-parse --short "$PR_BASE_SHA")
          HEAD_SHORT=$(git rev-parse --short HEAD)

          # ─── 门禁：目标分支代码 vs PR 合并结果 ───
          OASDIFF_OUTPUT=$(oasdiff breaking "$RELEASE_BASELINE" "$CURRENT" --fail-on ERR 2>&1)
          OASDIFF_EXIT=$?

          # Without fail-on, a nonzero exit means the tool could not compare the schemas.
          oasdiff breaking "$RELEASE_BASELINE" "$CURRENT" > /dev/null 2>&1
          OASDIFF_VALIDATION_EXIT=$?

          OPENAPI_DIFF_OUTPUT=$(docker run --rm \
            -v "${{ github.workspace }}/api:/work" \
            openapitools/openapi-diff:2.1.0-beta.11 \
            /work/"$RELEASE_BASELINE" \
            /work/"$CURRENT" \
            --fail-on-incompatible 2>&1)
          OPENAPI_DIFF_EXIT=$?

          docker run --rm \
            -v "${{ github.workspace }}/api:/work:ro" \
            openapitools/openapi-diff:2.1.0-beta.11 \
            /work/"$RELEASE_BASELINE" /work/"$CURRENT" > /dev/null 2>&1
          OPENAPI_VALIDATION_EXIT=$?

          # ─── PR 变更报告：当前 schema vs PR Base schema ───
          PR_CHANGELOG=""
          PR_DIFF_MD=""
          PR_REPORT_EXIT=1
          if [ "$PR_BASE_EXPORTED" = "true" ] && [ -f "$PR_BASE_SCHEMA" ]; then
            PR_CHANGELOG=$(oasdiff changelog "$PR_BASE_SCHEMA" "$CURRENT" 2>&1)
            PR_CHANGELOG_EXIT=$?

            docker run --rm \
              -v "${{ github.workspace }}/api:/work" \
              openapitools/openapi-diff:2.1.0-beta.11 \
              /work/"$PR_BASE_SCHEMA" \
              /work/"$CURRENT" \
              --markdown /work/openapi-pr-diff.md > /dev/null 2>&1
            PR_REPORT_EXIT=$?
            if [ "$PR_CHANGELOG_EXIT" -ne 0 ]; then PR_REPORT_EXIT=1; fi
            PR_DIFF_MD=$(cat openapi-pr-diff.md 2>/dev/null)
          fi

          # ─── 生成报告 ───
          {
            echo "# API 接口契约报告"
            echo ""
            echo "| 对比 | 基线 | 目标 |"
            echo "| --- | --- | --- |"
            echo "| 门禁与本 PR 接口变化 | 目标分支 \`$BASE_SHORT\` | 合并结果 \`$HEAD_SHORT\` |"
            echo ""
            echo "破坏性变更审批标签：\`api-breaking-approved\` = \`$API_BREAKING_APPROVED\`"
            echo ""
            echo "## 门禁结果"
            echo ""
            echo "检查本次合并对目标分支已接受接口契约的影响，不依赖手工 baseline。"
            echo ""
            echo "| Tool | Result |"
            echo "| --- | --- |"
          } > "$REPORT"

          if [ "$OASDIFF_EXIT" -eq 0 ]; then
            echo "| oasdiff | ✅ PASS |" >> "$REPORT"
          else
            echo "| oasdiff | ❌ FAIL |" >> "$REPORT"
          fi

          if [ "$OPENAPI_DIFF_EXIT" -eq 0 ]; then
            echo "| openapi-diff | ✅ PASS |" >> "$REPORT"
          else
            echo "| openapi-diff | ❌ FAIL |" >> "$REPORT"
          fi

          {
            echo ""
            echo "<details open>"
            echo "<summary>oasdiff breaking</summary>"
            echo ""
            echo '```text'
            if [ -n "$OASDIFF_OUTPUT" ]; then
              echo "$OASDIFF_OUTPUT"
            else
              echo "No breaking changes detected."
            fi
            echo '```'
            echo ""
            echo "</details>"

            echo ""
            echo "<details open>"
            echo "<summary>openapi-diff</summary>"
            echo ""
            echo '```text'
            if [ -n "$OPENAPI_DIFF_OUTPUT" ]; then
              echo "$OPENAPI_DIFF_OUTPUT"
            else
              echo "No incompatible changes detected."
            fi
            echo '```'
            echo ""
            echo "</details>"

            echo ""
            echo "### 门禁判定"
            echo ""
            if [ "$OASDIFF_VALIDATION_EXIT" -ne 0 ] || [ "$OPENAPI_VALIDATION_EXIT" -ne 0 ]; then
              echo "比较工具执行失败，门禁阻断，审批标签不可豁免。"
            elif [ "$OASDIFF_EXIT" -ne 0 ] || [ "$OPENAPI_DIFF_EXIT" -ne 0 ]; then
              if [ "$API_BREAKING_APPROVED" = "true" ]; then
                echo "检测到破坏性变更，但本 PR 已带 \`api-breaking-approved\` 标签，门禁放行。"
              else
                echo "检测到破坏性变更。只有在破坏性接口变更经过评审并批准后，才添加 \`api-breaking-approved\` 标签。"
              fi
            else
              echo "未检测到破坏性变更，门禁在没有审批豁免的情况下通过。"
            fi

            echo ""
            echo "## 本 PR 接口变化"
            echo ""
            echo "目标分支 \`$BASE_SHORT\` 与合并结果 \`$HEAD_SHORT\` 比较。"
            echo ""
          } >> "$REPORT"

          if [ "$PR_BASE_EXPORTED" = "true" ] && [ -f "$PR_BASE_SCHEMA" ]; then
            {
              echo "<details open>"
              echo "<summary>oasdiff changelog</summary>"
              echo ""
              echo '```text'
              if [ -n "$PR_CHANGELOG" ]; then
                echo "$PR_CHANGELOG"
              else
                echo "本 PR 未改变 API 契约。"
              fi
              echo '```'
              echo ""
              echo "</details>"
              if [ -n "$PR_DIFF_MD" ]; then
                echo ""
                echo "<details>"
                echo "<summary>openapi-diff</summary>"
                echo ""
                echo "$PR_DIFF_MD"
                echo ""
                echo "</details>"
              fi
            } >> "$REPORT"
          else
            echo "> PR Base schema 导出失败，本节无法生成，检查将失败。详见 Export PR base OpenAPI schema 步骤日志。" >> "$REPORT"
          fi

          if [ "$PR_REPORT_EXIT" -ne 0 ]; then
            echo "> PR 报告生成失败，请检查导出与 diff 日志后重跑。" >> "$REPORT"
          fi

          echo "oasdiff_exit=$OASDIFF_EXIT" >> "$GITHUB_OUTPUT"
          echo "openapi_diff_exit=$OPENAPI_DIFF_EXIT" >> "$GITHUB_OUTPUT"

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OASDIFF_VALIDATION_EXIT" -ne 0 ] || [ "$OPENAPI_VALIDATION_EXIT" -ne 0 ]; then
            echo "::error::A comparison tool failed. Approval labels cannot override execution errors."
            exit 1
          fi
          if [ "$PR_REPORT_EXIT" -ne 0 ]; then
            echo "::error::PR schema export or diff report failed; inspect the step logs."
            exit 1
          fi

          if [ "$OASDIFF_EXIT" -ne 0 ] || [ "$OPENAPI_DIFF_EXIT" -ne 0 ]; then
            if [ "$API_BREAKING_APPROVED" = "true" ]; then
              exit 0
            else
              exit 1
            fi
          fi

      - name: Comment PR
        if: always() && steps.filter.outputs.skip == 'false' && hashFiles('api/oasdiff-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: oasdiff
          path: api/oasdiff-report.md

      - name: Upload contract evidence
        if: always() && steps.filter.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-evidence
          path: |
            api/openapi-current.json
            api/openapi-pr-base.json
            api/openapi-*-audit.json
            api/oasdiff-report.md
