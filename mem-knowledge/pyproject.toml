[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mem-knowledge"
version = "0.1.0"
description = "Independent MemoryBear knowledge service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31,<1",
    "amqp==5.3.1",
    "beautifulsoup4>=4.13,<5",
    "billiard==4.2.2",
    "celery==5.5.3",
    "chardet==5.2.0",
    "datrie==0.8.3",
    "elasticsearch>=8.17,<9",
    "fastapi>=0.119,<1",
    "httpx>=0.28,<1",
    "html5lib==1.1",
    "hanziconv==0.3.2",
    "kombu==5.5.4",
    "json-repair==0.53.0",
    "lxml>=6,<7",
    "markdown==3.8",
    "mem-storage-core",
    "nltk==3.9.2",
    "openpyxl==3.1.5",
    "pillow==12.0.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.11,<3",
    "pypdf>=6.1,<7",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "redbear-model[all]",
    "redis>=6.4,<7",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0.44,<3",
    "tika==3.1.0",
    "tiktoken>=0.12,<1",
    "uvicorn[standard]>=0.37,<1",
    "xlrd>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[tool.uv.sources]
redbear-model = { path = "../packages/redbear-model" }
mem-storage-core = { path = "../packages/storage-core" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
