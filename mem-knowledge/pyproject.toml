[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mem-knowledge"
version = "0.1.0"
description = "Independent MemoryBear knowledge service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31,<1",
    "celery>=5.5,<6",
    "elasticsearch>=8.17,<9",
    "fastapi>=0.119,<1",
    "kombu>=5.5,<6",
    "mem-storage-core",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "redbear-model[all]",
    "redis>=6.4,<7",
    "sqlalchemy>=2.0.44,<3",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[tool.uv.sources]
redbear-model = { path = "../packages/redbear-model" }
mem-storage-core = { path = "../packages/storage-core" }

[tool.hatch.build.targets.wheel]
packages = ["src/mem_knowledge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
