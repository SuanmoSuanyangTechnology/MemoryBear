# MemoryBear E2B Sandbox Infrastructure
#
# Components:
# - orchestrator: Sandbox lifecycle management (docker-py SDK + warm pool + Redis state)
#
# The orchestrator reuses the project's existing Redis instance.
# Set REDIS_HOST / REDIS_PORT / REDIS_PASSWORD / REDIS_DB to match your project config.

services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: e2b-orchestrator
    ports:
      - "${E2B_ORCHESTRATOR_PORT:-3001}:3001"
    environment:
      - E2B_ORCHESTRATOR_PORT=${E2B_ORCHESTRATOR_PORT:-3001}
      - E2B_ORCHESTRATOR_SECRET=${E2B_ORCHESTRATOR_SECRET:-changeme}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ORCHESTRATOR_REDIS_DB=${ORCHESTRATOR_REDIS_DB:-10}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ORCHESTRATOR_DOCKER_HOSTS=${ORCHESTRATOR_DOCKER_HOSTS:-unix:///var/run/docker.sock}
      - E2B_TEMPLATE_REGISTRY=${E2B_TEMPLATE_REGISTRY:-}
      - E2B_TEMPLATE_ID=${E2B_TEMPLATE_ID:-agent-runtime}
      - E2B_SANDBOX_TIMEOUT=${E2B_SANDBOX_TIMEOUT:-300}
      - ORCHESTRATOR_MAX_SANDBOXES=${ORCHESTRATOR_MAX_SANDBOXES:-50}
      - E2B_SANDBOX_MEMORY_MB=${E2B_SANDBOX_MEMORY_MB:-512}
      - E2B_SANDBOX_CPU=${E2B_SANDBOX_CPU:-2}
      - E2B_WARM_POOL_SIZE=${E2B_WARM_POOL_SIZE:-2}
      - ORCHESTRATOR_LOG_LEVEL=${ORCHESTRATOR_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
