[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "application-service"
version = "0.1.0"
description = "Independent MemoryBear application service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31,<1",
    "auth-sdk>=0.1",
    "fastapi>=0.119,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "redis>=6.4,<7",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
# cryptography: the enterprise_ext.app suite generates RSA keys for JWT signing in
# tests (not a runtime dependency of this service; --no-dev images exclude it).
dev = [
    "cryptography>=44,<51",
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[tool.uv.sources]
auth-sdk = { path = "../packages/auth-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Mechanically copied from the monolith ORM (frozen copies): kept verbatim for
# line-by-line comparison with the host side during the coexistence period; no
# import-order or typing modernization is applied. Newly written service
# modules are not exempt.
"src/models/app_model.py" = ["E501", "F401", "I001", "UP006", "UP035", "UP045"]
