# Frozen port of the host workflow definition-plane closure (adapters, node
# configs, variable primitives): kept verbatim for line-by-line comparison;
# only import paths and the logger helper were rewritten mechanically.
"src/workflow/*.py" = ["E501", "E721", "E722", "F401", "F541", "I001", "UP006", "UP007", "UP035", "UP037", "UP045", "B904"]
