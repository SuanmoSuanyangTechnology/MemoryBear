[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "application-service"
version = "0.1.0"
description = "Independent MemoryBear application service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0,<25",
    "aiohttp>=3.13,<4",
    "asyncpg>=0.31,<1",
    "auth-sdk>=0.1",
    "boto3>=1.42,<2",
    "chardet>=5.2.0,<6",
    "deprecated>=1.3.1,<2",
    "fastapi>=0.119,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "json-repair>=0.53,<1",
    "langchain>=1.2,<2",
    "langchain-aws>=1.3,<2",
    "langchain-core>=1.2,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "langid>=1.1.6,<2",
    "olefile>=0.47,<1",
    "openpyxl>=3.1.5,<4",
    "orjson>=3.11,<4",
    "oss2>=2.19,<3",
    "pillow>=12.0,<13",
    "psycopg[binary]>=3.2,<4",
    "psycopg2-binary>=2.9.11,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pypdf2>=3.0.1,<4",
    "python-calamine>=0.4.0,<1",
    "python-docx>=1.2.0,<2",
    "python-dotenv>=1.1,<2",
    "python-magic>=0.4.14; sys_platform == 'linux' or sys_platform == 'darwin'",
    "python-multipart>=0.0.20,<1",
    "pytz>=2025.2,<2027",
    "pyyaml>=6.0.3,<7",
    "redbear-model[all]",
    "redis>=6.4,<7",
    "requests>=2.32,<3",
    "simpleeval>=1.0.3,<2",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "uvicorn[standard]>=0.37,<1",
    "volcengine-python-sdk[ark]>=5.0.19,<6",
    "websockets==15.0.1",
    "xlrd>=2.0.2,<3",
]

[dependency-groups]
# cryptography: the enterprise_ext.app suite generates RSA keys for JWT signing in
# tests (not a runtime dependency of this service; --no-dev images exclude it).
dev = [
    "cryptography>=44,<51",
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[tool.uv.sources]
auth-sdk = { path = "../packages/auth-sdk" }
redbear-model = { path = "../packages/redbear-model" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
