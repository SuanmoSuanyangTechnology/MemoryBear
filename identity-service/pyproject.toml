[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "auth-sdk>=0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "asyncpg>=0.29",
    "redis>=6.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "python-jose>=3.3",
    "python-dotenv>=1.0",
    "rsa>=4.9",
    "email-validator>=2.1",
    "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23"]

[tool.uv.sources]
auth-sdk = { path = "../packages/auth-sdk" }

# 包名即 src（src/__init__.py 在服务根下，代码平铺 + 子包并存）：显式声明全部包，
# 使 wheel 安装产出 package src 及其子包——find where=["src"] 会把子包打成顶层包、
# 漏掉 src 根模块（main/db/config/keys/redis），uvicorn src.main:app 将不可导入
[tool.setuptools]
packages = ["src", "src.controllers", "src.models",
            "src.repositories", "src.schemas", "src.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
