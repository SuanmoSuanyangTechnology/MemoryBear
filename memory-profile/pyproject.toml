[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memory-profile"
version = "0.1.0"
description = "Independent MemoryBear profile analytics service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Match API Agent orchestration; keep its compatible prebuilt implementation.
    "langchain==1.2.10",
    "langgraph-prebuilt==1.0.8",
    "pandas==2.3.3",
    "langid==1.1.6",
    "aiofiles==25.1.0",
    "boto3==1.42.60",
    "oss2==2.19.1",
    "olefile==0.47",
    "pypdf2==3.0.1",
    "chardet==5.2.0",
    "openpyxl==3.1.5",
    "python-calamine>=0.4.0",
    "xlrd==2.0.2",
    "python-docx==1.2.0",
    "python-magic==0.4.27; sys_platform != 'win32'",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "auth-sdk",
    "certifi==2026.10.23",
    "chonkie==1.3.1",
    "numpy==1.26.4",
    "elasticsearch[async]==8.16.0",
    "error-core",
    "fastapi==0.156.4",
    # Pins are explicit per service: this one runs the migrated generation
    # pipelines on its own FastAPI line and may lead the API host's versions,
    # so do not "align" them with api/pyproject.toml without re-validating the
    # prompt/tool-call behavior they were tested with.
    "json-repair==0.64.2",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "memory-contracts",
    "mem-storage-core",
    "jinja2==3.1.6",
    "neo4j==6.4.0",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "redbear-model[runtime]",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.5",
    # Explicit transitive security pin; keep it in step with the FastAPI pin
    # above rather than with the API host's starlette.
    "starlette==1.10.0",
    # Cache generation is executed by the memory-jobs Celery workers; this
    # service only publishes the task by name and waits for its result.
    "task-bridge-sdk[celery,mem-router]",
    "uvicorn[standard]==0.54.0",
    "xxhash==4.0.2",
    "zttp==0.0.35",
    "python-multipart>=0.0.20",
]

[tool.uv.sources]
auth-sdk = { path = "../packages/auth-sdk" }
error-core = { path = "../packages/error-core" }
memory-contracts = { path = "../packages/memory-contracts" }
mem-storage-core = { path = "../packages/storage-core" }
redbear-model = { path = "../packages/redbear-model" }
task-bridge-sdk = { path = "../packages/task-bridge-sdk" }

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The storage tree is a verbatim port of ``api/app/core/memory/storage``: keep it
# aligned with the host source (annotations, import style, line length) so future
# diffs against the host stay meaningful.
"src/storage/**" = [
    "E501",
    "I001",
    "UP006",
    "UP017",
    "UP035",
    "TID252",
    "B905",
    "F811",
]

# Existing Ruff violations, scoped to the affected files and rule codes.
"src/common/alias_utils.py" = ["E501", "I001", "UP006", "UP035"]
"src/common/data/ontology.py" = ["E501", "I001", "UP045"]
