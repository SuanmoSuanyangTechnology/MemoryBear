# memory-profile 独立迁移链（对齐 identity-service/alembic.ini）。
# 库连接不在此处：env.py 从 src.config.settings 组装 asyncpg URL（与
# infrastructure.database.session 同源），避免 .env 与 ini 两处配置漂移。
[alembic]
script_location = migrations
# 项目根进 sys.path 才能 import src.*（pyproject packages.find where=["."]、include=["src","src.*"]）
# —— uv editable 与容器 pip install 两种形态下都成立
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S